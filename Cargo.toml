[package]
name = "dscrd-status"
version = "0.1.0"
edition = "2021"
description = "A CLI daemon to maintain Discord online presence status"
license = "MIT"

[[bin]]
name = "dscrd-status"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
tungstenite = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["rustls-tls", "json"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenv = "0.15"
anyhow = "1"
tokio-stream = "0.1"
rand = "0.8"
regex = "1"
clap = { version = "4", features = ["derive"] }
